[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read-write", path = "../.env" },
  { access = "read-write", path = "../src/config/protocol.ts" },
  { access = "read-write", path = "./deployments" }
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

[etherscan]
arc_testnet = { key = "${ARC_EXPLORER_API_KEY}", url = "https://testnet.arcscan.app/api", chain = 5042002 }
